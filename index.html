<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Наша история — годовщина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#121212;
    --surface-2:#1c1c1e;
    --surface-3:#232326;
    --border:#262626;
    --border-2:#333;
    --text:#fafafa;
    --text-muted:#a8a8a8;
    --text-dim:#737373;
    --accent:#ff3040;
    --gradient:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
    --green:#22c55e;
    --green-soft:#86efac;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    max-width:480px;
    margin:0 auto;
    background:var(--bg);
  }

  /* ---------- TOP BAR ---------- */
  .ig-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 12px;
    padding-top:max(14px, env(safe-area-inset-top));
    background:rgba(10,10,10,0.88);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    z-index:10;
    flex-shrink:0;
  }

  .ig-user{
    display:flex; align-items:center; gap:10px;
    flex:1; justify-content:center;
  }

  .avatar-ring{
    padding:2px;
    border-radius:50%;
    background:var(--gradient);
    display:flex;
    flex-shrink:0;
  }

  .avatar-ring img{
    width:32px; height:32px;
    border-radius:50%;
    border:2px solid var(--bg);
    object-fit:cover;
    display:block;
    background:#222;
  }

  .username{
    font-size:14px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .username .sub{
    font-size:11px;
    color:var(--text-dim);
    font-weight:500;
    display:block;
    margin-top:1px;
    letter-spacing:0;
  }

  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    background:transparent;
    border:none;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background 0.15s;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,0.08);}
  .icon-btn svg{width:22px; height:22px;}

  /* ---------- PROGRESS STRIP ---------- */
  .progress-strip{
    display:flex; gap:3px;
    padding:8px 14px 0;
    flex-shrink:0;
    min-height:10px;
  }
  .progress-seg{
    flex:1;
    height:2.5px;
    background:rgba(255,255,255,0.15);
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .progress-seg .fill{
    position:absolute; inset:0;
    background:#fff;
    transform-origin:left;
    transform:scaleX(0);
    transition:transform 0.5s cubic-bezier(.2,.8,.2,1);
    border-radius:2px;
  }
  .progress-seg.active .fill{transform:scaleX(1);}

  /* ---------- STAGE ---------- */
  main#stage{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 16px 100px;
    position:relative;
    scrollbar-width:none;
  }
  main#stage::-webkit-scrollbar{display:none;}

  /* ---------- BOTTOM NAV ---------- */
  .ig-bottom{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:space-around;
    padding:10px 8px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:rgba(10,10,10,0.94);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--border);
    z-index:10;
  }
  .nav-btn{
    background:none; border:none;
    color:var(--text-dim);
    padding:8px 14px;
    cursor:pointer;
    transition:color 0.2s, transform 0.15s;
  }
  .nav-btn:hover{color:var(--text);}
  .nav-btn:active{transform:scale(0.88);}
  .nav-btn.active{color:var(--accent);}
  .nav-btn svg{width:24px; height:24px;}

  /* ---------- SCREEN ANIM ---------- */
  .screen{animation:screenIn 0.45s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes screenIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .screen.leaving{animation:screenOut 0.22s ease both;}
  @keyframes screenOut{to{opacity:0; transform:translateY(-10px);}}

  /* ---------- PROFILE (INTRO) ---------- */
  .profile-card{
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 16px;
  }
  .profile-avatar-wrap{
    position:relative;
    margin-bottom:18px;
  }
  .profile-avatar-ring{
    padding:3px;
    border-radius:50%;
    background:var(--gradient);
    width:96px; height:96px;
  }
  .profile-avatar{
    width:100%; height:100%;
    border-radius:50%;
    border:3px solid var(--bg);
    object-fit:cover;
    background:#222;
    display:block;
  }
  .profile-name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 4px;
    font-family:'Manrope',sans-serif;
  }
  .profile-bio{
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    max-width:300px;
    line-height:1.6;
    margin:0;
  }
  .profile-stats{
    display:flex;
    gap:38px;
    margin-top:26px;
    justify-content:center;
  }
  .stat{text-align:center;}
  .stat b{
    display:block;
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin-bottom:3px;
  }
  .stat span{
    font-size:10px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-weight:600;
  }

  /* ---------- BUTTONS ---------- */
  .btn-primary{
    width:100%;
    padding:15px;
    background:var(--gradient);
    border:none;
    border-radius:14px;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:28px;
    transition:transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    letter-spacing:0.01em;
    box-shadow:0 8px 24px rgba(220,39,67,0.2);
  }
  .btn-primary:hover{opacity:0.94;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-primary:disabled{opacity:0.6; cursor:wait;}

  .btn-ghost{
    width:100%;
    padding:15px;
    background:transparent;
    border:1px solid var(--border-2);
    border-radius:14px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    transition:background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.04); border-color:#444;}
  .btn-ghost:active{transform:scale(0.97);}

  /* ---------- QUESTION CARD ---------- */
  .q-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px 18px 20px;
  }
  .q-meta{
    display:flex; align-items:center; gap:8px;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-bottom:14px;
    font-weight:700;
  }
  .dot-live{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    animation:blink 1.6s ease-in-out infinite;
    box-shadow:0 0 8px rgba(255,48,64,0.6);
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }
  .q-title{
    font-family:'Cormorant Garamond',serif;
    font-size:27px;
    font-weight:600;
    line-height:1.2;
    margin:0 0 22px;
    letter-spacing:-0.015em;
  }

  .options{display:flex; flex-direction:column; gap:9px;}

  .option-btn{
    width:100%;
    padding:15px 16px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s, transform 0.1s;
    display:flex; align-items:center; gap:12px;
    line-height:1.35;
  }
  .option-btn::before{
    content:'';
    width:20px; height:20px;
    border-radius:50%;
    border:1.5px solid var(--border-2);
    flex-shrink:0;
    transition:all 0.2s;
  }
  .option-btn:hover{background:var(--surface-3); border-color:var(--border-2);}
  .option-btn:active{transform:scale(0.985);}

  .option-btn.correct{
    background:rgba(34,197,94,0.12);
    border-color:rgba(34,197,94,0.4);
    color:var(--green-soft);
  }
  .option-btn.correct::before{
    background:var(--green);
    border-color:var(--green);
    box-shadow:inset 0 0 0 4px var(--surface);
  }
  .option-btn.wrong{
    background:rgba(239,68,68,0.1);
    border-color:rgba(239,68,68,0.4);
    animation:shake 0.35s ease;
  }
  @keyframes shake{
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  /* ---------- REVEAL CARD ---------- */
  .reveal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:26px 20px 22px;
    text-align:center;
  }
  .reveal-label{
    display:inline-block;
    padding:5px 14px;
    background:rgba(34,197,94,0.15);
    color:var(--green-soft);
    border-radius:100px;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-bottom:18px;
  }
  .reveal-lead{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:23px;
    line-height:1.4;
    color:var(--text);
    margin:12px 0;
    font-weight:500;
  }

  /* ---------- PHOTO ELEMENTS ---------- */
  .polaroid{
    background:#fff;
    padding:8px 8px 32px;
    border-radius:4px;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    display:inline-block;
    max-width:92%;
    transform:rotate(-1.5deg);
    margin:6px 0;
  }
  .polaroid img{display:block; width:100%; border-radius:2px;}

  .photo-placeholder{
    width:100%;
    border-radius:14px;
    background:linear-gradient(135deg,#1e1e20,#141416);
    border:1.5px dashed var(--border-2);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--text-dim);
    overflow:hidden;
  }
  .photo-placeholder svg{width:34px; height:34px; opacity:0.5;}
  .photo-placeholder span{font-size:11px; font-weight:600; letter-spacing:0.05em;}

  /* ---------- PHOTO GRID ---------- */
  .photo-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .photo-cell{
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    transition:all 0.5s cubic-bezier(.2,.8,.2,1);
    border:2px solid transparent;
    background:linear-gradient(135deg,#1e1e20,#141416);
  }
  .photo-cell img{width:100%; height:100%; object-fit:cover; display:block;}

  .photo-grid.resolved .photo-cell:not(.chosen){
    opacity:0.15;
    transform:scale(0.88);
  }
  .photo-grid.resolved .photo-cell.chosen{
    grid-column:1/3;
    grid-row:1/3;
    aspect-ratio:4/5;
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(34,197,94,0.2);
  }

.montage-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  animation: montageFade 0.35s ease;
}

@keyframes montageFade{
  from{
    opacity:0;
    transform:scale(1.03);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}
  
  /* ---------- PROOF IMAGE ---------- */
  .proof-image{
    width:100%;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#111;
  }
  .proof-image img{width:100%; display:block;}

  /* ---------- TYPEWRITER ---------- */
  .typewriter{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:23px;
    line-height:1.45;
    color:var(--text);
    min-height:2.6em;
    font-weight:500;
  }
  .caret{
    display:inline-block;
    width:2px;
    background:var(--text);
    animation:caretBlink 0.9s step-end infinite;
    margin-left:2px;
    height:1em;
    vertical-align:middle;
  }
  @keyframes caretBlink{50%{opacity:0;}}

  /* ---------- VIDEO ---------- */
  .video-wrap{
    width:100%;
    aspect-ratio:4/5;
    border-radius:16px;
    overflow:hidden;
    background:#000;
    position:relative;
  }
  .video-wrap video{width:100%; height:100%; object-fit:cover;}

  /* ---------- COLLAGE ---------- */
  .collage{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-bottom:18px;
  }
  .collage .piece{
    width:78px;
    aspect-ratio:1/1;
    border-radius:12px;
    overflow:hidden;
    background:linear-gradient(135deg,#1e1e20,#141416);
    border:1px solid var(--border);
    animation:popIn 0.5s cubic-bezier(.2,.8,.2,1) both;
  }
  .collage .piece img{width:100%; height:100%; object-fit:cover; display:block;}
  @keyframes popIn{
    from{opacity:0; transform:scale(0.6);}
    to{opacity:1; transform:scale(1);}
  }

  /* ---------- MONTAGE ---------- */
  .montage-box{
    width:100%;
    aspect-ratio:4/5;
    border-radius:16px;
    overflow:hidden;
    background:#0a0a0a;
    border:1px solid var(--border);
    margin-bottom:18px;
  }
  .montage-box img{width:100%; height:100%; object-fit:cover; display:block;}

  .stats-row{
    display:flex;
    justify-content:space-around;
    padding:16px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .stats-row .stat b{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    color:var(--text);
    font-weight:600;
    margin-bottom:2px;
  }
  .stats-row .stat span{
    font-size:9px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-weight:700;
  }


.photo-cell.wrong-cell{
  border-color:#ef4444;
  box-shadow:0 0 0 3px rgba(239,68,68,0.25);
  animation:shake 0.4s ease;
  pointer-events:none;
  opacity:0.55;
}
.photo-cell.wrong-cell::after{
  content:'✕';
  position:absolute;
  inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(239,68,68,0.25);
  color:#fff;
  font-size:32px;
  font-weight:800;
  backdrop-filter:blur(2px);
}


  /* ---------- FINAL ---------- */
  .final-card{
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    padding:20px 8px;
  }
  .final-heart{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--gradient);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    animation:heartPulse 1.8s ease-in-out infinite;
    box-shadow:0 0 40px rgba(225,48,108,0.4);
  }
  .final-heart svg{width:32px; height:32px; color:#fff;}
  @keyframes heartPulse{
    0%,100%{transform:scale(1); box-shadow:0 0 40px rgba(225,48,108,0.4);}
    50%{transform:scale(1.07); box-shadow:0 0 65px rgba(225,48,108,0.65);}
  }
  .final-title{
    font-family:'Cormorant Garamond',serif;
    font-size:32px;
    font-weight:600;
    line-height:1.15;
    margin:0 0 16px;
    letter-spacing:-0.02em;
  }
  .final-text{
    font-size:15px;
    line-height:1.65;
    color:var(--text-muted);
    margin:0 0 4px;
  }
  .final-quote{
    margin-top:20px;
    color:var(--text);
    font-style:italic;
    font-family:'Cormorant Garamond',serif;
    font-size:21px;
    line-height:1.4;
    font-weight:500;
  }

  /* ---------- LETTER / PARCHMENT ---------- */
  .letter-preview{
    width:100%;
    max-width:360px;
    aspect-ratio:1/1.414;
    margin:0 auto;
    border-radius:6px;
    box-shadow:0 24px 50px rgba(0,0,0,0.7);
    overflow:hidden;
    position:relative;
    cursor:pointer;
    transition:transform 0.3s;
    background:#e8d9b8;
  }
  .letter-preview:active{transform:scale(0.985);}

  .parchment-bg{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(235,215,175,0.85), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(140,100,60,0.5), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(200,170,120,0.35), transparent 70%),
      linear-gradient(135deg,#ecdcb8 0%,#dcc596 40%,#c9ad7a 100%);
  }
  .parchment-bg::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(120,80,40,0.18) 0%, transparent 3%),
      radial-gradient(circle at 75% 60%, rgba(120,80,40,0.14) 0%, transparent 4%),
      radial-gradient(circle at 40% 85%, rgba(120,80,40,0.16) 0%, transparent 3%),
      radial-gradient(circle at 85% 15%, rgba(120,80,40,0.12) 0%, transparent 5%),
      radial-gradient(circle at 55% 40%, rgba(120,80,40,0.08) 0%, transparent 6%);
    opacity:0.95;
  }
  .parchment-bg.with-image{
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .parchment-bg.with-image::before{display:none;}

  .parchment-edge{
    position:absolute; inset:0;
    box-shadow:inset 0 0 90px rgba(80,40,10,0.4);
    pointer-events:none;
  }

  .letter-content{
    position:absolute; inset:0;
    padding:10% 11%;
    display:flex; flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#3a2410;
    font-family:'Cormorant Garamond',serif;
  }
  .letter-date{
    font-size:10px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:#7a5a30;
    margin-bottom:14px;
    font-weight:700;
    font-style:normal;
    font-family:'Manrope',sans-serif;
  }
  .letter-body{
    font-size:16px;
    line-height:1.65;
    color:#3a2410;
    margin:0 0 8px;
    font-weight:500;
  }
  .letter-continuation{
    position:absolute;
    bottom:6%;
    left:0; right:0;
    font-size:8px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:#7a5a30;
    opacity:0.75;
    font-family:'Manrope',sans-serif;
    font-weight:700;
  }

  /* ---------- LETTER OVERLAY ---------- */
  .letter-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    z-index:100;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:20px;
    animation:fadeIn 0.3s ease both;
    overflow-y:auto;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

  .letter-overlay .letter-preview{
    margin:0 0 22px;
    cursor:default;
    max-width:380px;
  }
  .letter-overlay .btn-primary,
  .letter-overlay .btn-ghost{
    max-width:380px;
    margin-top:0;
  }
  .letter-overlay .btn-primary{margin-bottom:10px;}

  /* ---------- PDF LETTER (hidden) ---------- */
  .pdf-letter{
    position:fixed;
    left:-9999px;
    top:0;
    width:800px;
    height:1131px;
    pointer-events:none;
  }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;
    bottom:110px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:12px 22px;
    border-radius:100px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    opacity:0;
    transition:all 0.3s cubic-bezier(.2,.8,.2,1);
    z-index:200;
    pointer-events:none;

<script>
/* ============================================================

   ============================================================ */
window.PHOTOS = {
  avatar:       'Avatar.jpg',   // ← АВАТАРКА (профиль и топбар)
  q1_first:     '',   // первое фото вместе
  q2_proof:     'Вопрос 2.PNG',   // фото-доказательство (скриншот/фото) для вопроса №2
  q3_a: 'Вопрос 3.jpg', q3_b: 'Вопрос 3 (1).jpg', q3_c: 'Вопрос 3 верный.jpg', q3_d: 'Вопрос 3 не верный.jpg',        // 4 фото для вопроса №3
  q5_1: 'IMG_4109.JPG', q5_2: 'IMG_7937.jpg', q5_3: 'IMG_1428.jpg', q5_4: 'IMG_3446.jpg', q5_5: 'IMG_3799.jpg',  // коллаж вопроса №5
  q6_montage: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg'],          // нарезка фото вопроса №6

};

window.MEDIA = {
  q4_video: 'Видео.mp4'        // видео особенного момента (вопрос №4)
};

// Фон письма — вставьте ссылку или base64 на пергаментную бумагу.
// Если оставить пустым — будет красивый CSS-пергамент.
window.LETTER_PAPER = '';

window.CONFIG = {
  startDate: '20.09.2025',
  daysTogether: 365,
  monthsTogether: 12,

  username: '@our.story',
  statusText: 'наша история',
  profileName: 'Наша история',

};

/* ============================================================
   ВОПРОСЫ
   ============================================================ */
const QUESTIONS = [
  {
    key: 'q1',
    question: 'Где мы впервые встретились?',
    options: ['В кафе ☕', 'На прогулке 🌙', 'На лавочке 🪑', 'В месте, которое теперь стало особенным ❤️'],
    correct: 2,
    revealCaption: 'Тогда мы ещё даже не представляли, что этот момент станет началом нашей истории…',
    type: 'photo', photoKey: 'q1_first'
  },
  {
    key: 'q2',
    question: 'Кто первым понял, что между нами что-то происходит?',
    options: ['Я 😏', 'Ты 🥰', 'Мы оба одновременно', 'Никто. Просто судьба решила всё сама'],
    correct: 1,
    revealCaption: 'И именно после этого всё начало становиться немного серьёзнее…',
    type: 'proof', proofKey: 'q2_proof'
  },
  {
    key: 'q3',
    question: 'Какая из этих фотографий была сделана первой?',
    type: 'photogrid',
    revealTitle: 'Ты действительно это помнишь 🥹',
    revealCaption: 'Это было ещё до того, как мы знали, сколько всего нам предстоит пережить вместе.'
  },
  {
    key: 'q4',
    question: 'Какой из этих моментов я бы хотел пережить с тобой ещё раз?',
    options: ['Наша первая поездка', 'Один обычный вечер вдвоём', 'Наше первое большое событие', 'День, когда мы просто были вместе и никуда не спешили'],
    type: 'anyAnswer',
    preReveal: 'А вот здесь правильный ответ знаю только я…'
  },
  {
    key: 'q5',
    question: 'Что я люблю больше всего в наших отношениях?',
    options: ['Наши разговоры до ночи', 'Наши спонтанные приключения', 'То, как мы можем смеяться над полной ерундой', 'Абсолютно всё, что связано с нами'],
    correct: 3,
    type: 'collage',
    revealTitle: 'Наверное, именно это.',
    revealCaption: 'Потому что рядом с тобой даже самый обычный день становится особенным.'
  },
  {
    key: 'q6',
    question: 'Сколько воспоминаний мы успели создать за этот год?',
    options: ['Слишком мало', '100+', 'Я уже сбился со счёта', 'Столько, что одного квиза недостаточно ❤️'],
    correct: 3,
    type: 'montage'
  },
  {
    key: 'q7',
    question: 'Ты готова продолжить эту историю со мной?',
    options: ['Конечно ❤️', 'А у меня есть выбор? 😏', 'Ещё спрашиваешь?', 'Да. И ещё много-много лет.'],
    type: 'anyAnswer',
    isFinal: true
  }
];

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const stage = document.getElementById('stage');
const progressStrip = document.getElementById('progressStrip');
const topAvatar = document.getElementById('topAvatar');
let current = -1;

function setAvatar(){
  const src = window.PHOTOS.avatar;
  if(src){
    topAvatar.src = src;
  } else {
    // Красивая заглушка-аватарка
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f09433"/><stop offset="50%" stop-color="#dc2743"/><stop offset="100%" stop-color="#bc1888"/></linearGradient></defs><rect fill="url(#g)" width="100" height="100"/><circle cx="50" cy="40" r="16" fill="#fff" opacity="0.95"/><ellipse cx="50" cy="82" rx="28" ry="20" fill="#fff" opacity="0.95"/></svg>';
    topAvatar.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
}

function renderProgress(activeIdx){
  if(activeIdx < 0){ progressStrip.innerHTML = ''; return; }
  progressStrip.innerHTML = QUESTIONS.map((_, i) => {
    const cls = 'progress-seg' + (i <= activeIdx ? ' active' : '');
    return `<div class="${cls}"><div class="fill"></div></div>`;
  }).join('');
}

function photoImg(key, label){
  const src = window.PHOTOS[key];
  if(src) return `<img src="${src}" alt="${label}">`;
  return '';
}

function setScreen(html, after){
  const old = stage.querySelector('.screen');
  const render = () => {
    stage.innerHTML = `<div class="screen">${html}</div>`;
    stage.scrollTop = 0;
    if(after) after();
  };
  if(old){
    old.classList.add('leaving');
    setTimeout(render, 200);
  } else {
    render();
  }
}

/* ============================================================
   ИНТРО
   ============================================================ */
function renderIntro(){
  renderProgress(-1);
  const avatarSrc = topAvatar.src;

  setScreen(`
    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar-ring">
          <img class="profile-avatar" src="${avatarSrc}" alt="avatar">
        </div>
      </div>
      <h1 class="profile-name">${window.CONFIG.profileName}</h1>
      <p class="profile-bio">${window.CONFIG.profileBio}</p>

      <div class="profile-stats">
        <div class="stat"><b>${QUESTIONS.length}</b><span>вопросов</span></div>
        <div class="stat"><b>${window.CONFIG.daysTogether}</b><span>дней</span></div>
        <div class="stat"><b>∞</b><span>моментов</span></div>
      </div>

      <button class="btn-primary" id="startBtn">Начать ❤️</button>
    </div>
  `, () => {
    document.getElementById('startBtn').onclick = () => goTo(0);
  });
}

/* ============================================================
   РОУТЕР
   ============================================================ */
function goTo(idx){
  current = idx;
  renderProgress(idx);
  const q = QUESTIONS[idx];
  if(q.type === 'photogrid') return renderPhotoGrid(q, idx);
  return renderQuestion(q, idx);
}

function renderQuestion(q, idx){
  const optionsHtml = q.options.map((o, i) =>
    `<button class="option-btn" data-i="${i}">${o}</button>`
  ).join('');

  setScreen(`
    <div class="q-card">
      <div class="q-meta">
        <span class="dot-live"></span>
        Вопрос ${idx + 1} из ${QUESTIONS.length}
      </div>
      <h2 class="q-title">${q.question}</h2>
      <div class="options" id="opts">${optionsHtml}</div>
    </div>
  `, () => {
    document.querySelectorAll('#opts .option-btn').forEach(btn => {
      btn.onclick = () => handleAnswer(q, idx, parseInt(btn.dataset.i), btn);
    });
  });
}

function handleAnswer(q, idx, i, btn){
  if(q.type === 'anyAnswer') return revealFor(q, idx);
  if(i === q.correct){
    btn.classList.add('correct');
    document.querySelectorAll('#opts .option-btn').forEach(b => b.style.pointerEvents = 'none');
    setTimeout(() => revealFor(q, idx), 600);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 400);
  }
}

/* ============================================================
   PHOTO GRID (Q3)
   ============================================================ */
function renderPhotoGrid(q, idx){
  const keys = ['q3_a','q3_b','q3_c','q3_d'];
  const cells = keys.map((k, i) => {
    const src = window.PHOTOS[k];
    const inner = src
      ? `<img src="${src}" alt="Фото ${i+1}">`
      : `<div class="photo-placeholder" style="height:100%;border:none;border-radius:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Фото ${i+1}</span></div>`;
    return `<div class="photo-cell" data-i="${i}">${inner}</div>`;
  }).join('');

  setScreen(`
    <div class="q-card">
      <div class="q-meta">
        <span class="dot-live"></span>
        Вопрос ${idx + 1} из ${QUESTIONS.length}
      </div>
      <h2 class="q-title">${q.question}</h2>
      <div class="photo-grid" id="pgrid">${cells}</div>
    </div>
  `, () => {
    const grid = document.getElementById('pgrid');
    const correctIdx = window.CONFIG.q3CorrectIndex;

    grid.querySelectorAll('.photo-cell').forEach(cell => {
      cell.onclick = () => {
        if(grid.classList.contains('resolved')) return;
        if(cell.classList.contains('wrong-cell')) return;

        const ci = parseInt(cell.dataset.i);

        if(ci === correctIdx){
          // ✅ Верный выбор
          grid.classList.add('resolved');
          const cellsAll = grid.querySelectorAll('.photo-cell');
          if(cellsAll[correctIdx]) cellsAll[correctIdx].classList.add('chosen');
          setTimeout(() => revealFor(q, idx), 950);
        } else {
          // ❌ Неверный выбор — подсветить красным и заблокировать
          cell.classList.add('wrong-cell');
        }
      };
    });
  });
}

/* ============================================================
   REVEAL
   ============================================================ */
function revealFor(q, idx){
  if(q.isFinal) return renderFinal();
  switch(q.type){
    case 'photo':     return revealPhoto(q, idx);
    case 'proof':     return revealProof(q, idx);
    case 'photogrid': return revealPhotoGrid(q, idx);
    case 'anyAnswer': return revealAny(q, idx);
    case 'collage':   return revealCollage(q, idx);
    case 'montage':   return revealMontage(q, idx);
    default:          return nextAfter(idx);
  }
}

function revealPhoto(q, idx){
  const src = window.PHOTOS[q.photoKey];
  const inner = src
    ? `<div class="polaroid"><img src="${src}" alt=""></div>`
    : `<div class="photo-placeholder" style="aspect-ratio:4/5;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Первая фотография</span></div>`;

  setScreen(`
    <div class="reveal-card">
      <div class="reveal-label">Верно</div>
      ${inner}
      <p style="color:var(--text-muted);font-size:14px;line-height:1.65;margin-top:18px;">${q.revealCaption}</p>
      <button class="btn-primary" id="nextBtn">Дальше</button>
    </div>
  `, () => {
    document.getElementById('nextBtn').onclick = () => nextAfter(idx);
  });
}

function revealProof(q, idx){
  setScreen(`
    <div class="reveal-card">
      <div class="typewriter" id="tw"></div>
      <button class="btn-primary" id="showProof" style="display:none;">Показать доказательство →</button>
    </div>
  `, () => {
    const tw = document.getElementById('tw');
    tw.innerHTML = '<span class="txt"></span><span class="caret"></span>';
    const txt = tw.querySelector('.txt');
    let i = 0;
    const iv = setInterval(() => {
      txt.textContent += q.revealCaption[i];
      i++;
      if(i >= q.revealCaption.length){
        clearInterval(iv);
        const btn = document.getElementById('showProof');
        btn.style.display = 'block';
        btn.onclick = () => showProofPhoto(q, idx);
      }
    }, 28);
  });
}

function showProofPhoto(q, idx){
  const src = window.PHOTOS[q.proofKey];
  const inner = src
    ? `<div class="proof-image"><img src="${src}" alt="Доказательство"></div>`
    : `<div class="photo-placeholder" style="aspect-ratio:9/16;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-2.5h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Фото-доказательство</span></div>`;

  setScreen(`
    <div class="reveal-card">
      <div class="reveal-label">Доказательство</div>
      ${inner}
      <button class="btn-primary" id="nextBtn">Дальше</button>
    </div>
  `, () => {
    document.getElementById('nextBtn').onclick = () => nextAfter(idx);
  });
}

function revealPhotoGrid(q, idx){
  setScreen(`
    <div class="reveal-card">
      <div class="reveal-label">Верно</div>
      <p class="reveal-lead">${q.revealTitle}</p>
      <p style="color:var(--text-muted);font-size:14px;line-height:1.65;">${q.revealCaption}</p>
      <button class="btn-primary" id="nextBtn">Дальше</button>
    </div>
  `, () => {
    document.getElementById('nextBtn').onclick = () => nextAfter(idx);
  });
}

function revealAny(q, idx){
  setScreen(`
    <div class="reveal-card" style="background:rgba(0,0,0,0.4);">
      <p class="reveal-lead" style="margin:0;">${q.preReveal}</p>
    </div>
  `, () => {
    setTimeout(() => {
      const videoSrc = window.MEDIA.q4_video;
      const videoHtml = videoSrc
        ? `<div class="video-wrap"><video src="${videoSrc}" controls playsinline></video></div>`
        : `<div class="photo-placeholder" style="aspect-ratio:4/5;"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span>Ваше видео</span></div>`;

      setScreen(`
        <div class="reveal-card">
          ${videoHtml}
          <p style="color:var(--text-muted);font-size:14px;line-height:1.7;margin-top:18px;">${window.CONFIG.q4Reveal}</p>
          <button class="btn-primary" id="nextBtn">Дальше</button>
        </div>
      `, () => {
        document.getElementById('nextBtn').onclick = () => nextAfter(idx);
      });
    }, 1700);
  });
}

function revealCollage(q, idx){
  const keys = ['q5_1','q5_2','q5_3','q5_4','q5_5'];
  setScreen(`
    <div class="reveal-card">
      <div class="collage" id="collage"></div>
      <p class="reveal-lead">${q.revealTitle}</p>
      <p style="color:var(--text-muted);font-size:14px;line-height:1.65;">${q.revealCaption}</p>
      <button class="btn-primary" id="nextBtn" style="display:none;">Дальше</button>
    </div>
  `, () => {
    const box = document.getElementById('collage');
    keys.forEach((k, i) => {
      setTimeout(() => {
        const src = window.PHOTOS[k];
        const el = document.createElement('div');
        el.className = 'piece';
        el.innerHTML = src
          ? `<img src="${src}" alt="">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#e8b4c0;font-size:22px;">❤</div>`;
        box.appendChild(el);
        if(i === keys.length - 1){
          const b = document.getElementById('nextBtn');
          b.style.display = 'block';
          b.onclick = () => nextAfter(idx);
        }
      }, i * 200);
    });
  });
}

function revealMontage(q, idx){
  const keys = window.PHOTOS.q6_montage;
  setScreen(`
    <div class="reveal-card">
      <div class="montage-box" id="mBox"></div>
      <div class="stats-row">
        <div class="stat"><b>${window.CONFIG.daysTogether}</b><span>дней</span></div>
        <div class="stat"><b>${window.CONFIG.monthsTogether}</b><span>месяцев</span></div>
        <div class="stat"><b>∞</b><span>моментов</span></div>
      </div>
      <p class="reveal-lead" style="margin:0 0 18px;">И это только первый год…</p>
      <button class="btn-primary" id="nextBtn" style="margin-top:0;">Дальше</button>
    </div>
  `, () => {
    const box = document.getElementById('mBox');
    let i = 0;

setInterval(() => {
  const src = keys[i % keys.length];

  box.innerHTML = src
    ? `<img src="${src}" alt="">`
    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e1e20,#141416);color:#666;font-size:11px;font-weight:600;">Фото ${(i % keys.length) + 1}</div>`;

  i++;
}, 1200);
    document.getElementById('nextBtn').onclick = () => nextAfter(idx);
  });
}

function nextAfter(idx){
  if(idx + 1 < QUESTIONS.length) goTo(idx + 1);
  else renderFinal();
}

/* ============================================================
   ФИНАЛ
   ============================================================ */
function renderFinal(){
  renderProgress(QUESTIONS.length - 1);

  setScreen(`
    <div class="final-card">
      <div class="final-heart">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.1C.4 8.6 2 5 5.6 5c2 0 3.4 1.1 4.4 2.6C11 6.1 12.4 5 14.4 5 18 5 19.6 8.6 22 11.9 14.5 16.4 12 21 12 21z"/></svg>
      </div>
      <h1 class="final-title">С годовщиной,<br>моя любимая.</h1>
      <p class="final-text">1 год.</p>
      <p class="final-text">${window.CONFIG.daysTogether} дней.</p>
      <p class="final-text">Тысячи сообщений.</p>
      <p class="final-text">Сотни фотографий.</p>
      <p class="final-text">Бесконечное количество<br>маленьких моментов.</p>
      <p class="final-quote">И знаешь…<br>я бы выбрал тебя снова. ❤️</p>

      <button class="btn-primary" id="openLetter" style="margin-top:34px;">Открыть письмо 💌</button>
    </div>
  `, () => {
    document.getElementById('openLetter').onclick = openLetterOverlay;
  });
}

/* ============================================================
   ПИСЬМО + PDF
   ============================================================ */
function letterHTML(){
  const paras = window.CONFIG.letterParagraphs;
  const paper = window.LETTER_PAPER;
  const bgStyle = paper ? `style="background-image:url('${paper}');"` : '';

  return `
    <div class="parchment-bg ${paper ? 'with-image' : ''}" ${bgStyle}></div>
    <div class="parchment-edge"></div>
    <div class="letter-content">
      <div class="letter-date">${window.CONFIG.letterTitle}</div>
      ${paras.map(p => `<p class="letter-body">${p}</p>`).join('')}
      <div class="letter-continuation">${window.CONFIG.continuation}</div>
    </div>
  `;
}

function openLetterOverlay(){
  const overlay = document.createElement('div');
  overlay.className = 'letter-overlay';
  overlay.innerHTML = `
    <div class="letter-preview">${letterHTML()}</div>
    <button class="btn-primary" id="downloadPdf" style="margin-top:22px;">Скачать PDF 📄</button>
    <button class="btn-ghost" id="closeLetter">Закрыть</button>
  `;
  document.body.appendChild(overlay);

  document.getElementById('closeLetter').onclick = () => overlay.remove();
  document.getElementById('downloadPdf').onclick = async () => {
    const btn = document.getElementById('downloadPdf');
    btn.textContent = 'Готовим PDF…';
    btn.disabled = true;
    try {
      await downloadLetterPDF();
      showToast('Письмо сохранено 💌');
    } catch(e){
      console.error(e);
      showToast('Не удалось. Попробуйте ещё раз.');
    }
    btn.textContent = 'Скачать PDF 📄';
    btn.disabled = false;
  };
}

async function downloadLetterPDF(){
  const link = document.createElement('a');

  link.href = 'letter.pdf';
  link.download = 'письмо любимой.pdf';

  document.body.appendChild(link);
  link.click();
  link.remove();
}

function showToast(msg){
  let t = document.querySelector('.toast');
  if(!t){
    t = document.createElement('div');
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   ЗАПУСК
   ============================================================ */
setAvatar();
document.getElementById('topName').textContent = window.CONFIG.username;
document.getElementById('topSub').textContent = window.CONFIG.statusText;

document.getElementById('backBtn').onclick = () => {
  if(current > 0) goTo(current - 1);
  else if(current === 0){ current = -1; renderIntro(); }
};

renderIntro();
</script>
